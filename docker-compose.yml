services:

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: pieta_care
      POSTGRES_USER: pieta
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pieta -d pieta_care"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://pieta:${DB_PASSWORD}@db:5432/pieta_care
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8002:8000"

volumes:
  postgres_data:
