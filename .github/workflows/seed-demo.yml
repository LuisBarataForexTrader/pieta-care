name: Seed demo account

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Owner email (default: demo@pietas.care)"
        required: false
        default: "demo@pietas.care"
      plan:
        description: "Plan tier: familia | familia_plus | cuidador_pro"
        required: false
        default: "cuidador_pro"
      name:
        description: "Owner full name"
        required: false
        default: "Sofia Ferreira"
      phone:
        description: "Owner phone"
        required: false
        default: "+351 932 145 678"
      days:
        description: "How many days of history to populate"
        required: false
        default: "60"
      status:
        description: "Subscription state: active | trial | expired"
        required: false
        default: "active"
      trial_days:
        description: "If status=trial, how many days remain (default 7)"
        required: false
        default: "7"

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Run seed via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEMO_OWNER_EMAIL: ${{ inputs.email }}
          DEMO_PLAN: ${{ inputs.plan }}
          DEMO_OWNER_NAME: ${{ inputs.name }}
          DEMO_OWNER_PHONE: ${{ inputs.phone }}
          DEMO_DAYS: ${{ inputs.days }}
          DEMO_STATUS: ${{ inputs.status }}
          DEMO_TRIAL_DAYS: ${{ inputs.trial_days }}
        with:
          host: 178.104.5.182
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: DEMO_OWNER_EMAIL,DEMO_PLAN,DEMO_OWNER_NAME,DEMO_OWNER_PHONE,DEMO_DAYS,DEMO_STATUS,DEMO_TRIAL_DAYS
          script: |
            set -eu
            cd /opt/pieta-care
            git fetch origin main
            git reset --hard origin/main

            docker compose exec -T \
              -e DEMO_OWNER_EMAIL="$DEMO_OWNER_EMAIL" \
              -e DEMO_PLAN="$DEMO_PLAN" \
              -e DEMO_OWNER_NAME="$DEMO_OWNER_NAME" \
              -e DEMO_OWNER_PHONE="$DEMO_OWNER_PHONE" \
              -e DEMO_DAYS="$DEMO_DAYS" \
              -e DEMO_STATUS="$DEMO_STATUS" \
              -e DEMO_TRIAL_DAYS="$DEMO_TRIAL_DAYS" \
              api python scripts/seed_demo.py
