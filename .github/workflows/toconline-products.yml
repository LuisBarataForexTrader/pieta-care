name: Create TOConline products

# One-shot: create the 3 pietas.care products in TOConline.
# Idempotent — re-runs are safe (existing item_codes are skipped).

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Run via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.5.182
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -eu
            cd /opt/pieta-care
            git fetch origin main
            git reset --hard origin/main

            # Find TNT's news.db (Postgres or SQLite). It's not always at
            # /opt/tnt — TNT may have moved during the Hetzner migration.
            echo "→ TNT discovery"
            DB=$(find /opt /home -maxdepth 4 -name 'news.db' -type f 2>/dev/null | head -1)
            if [ -z "$DB" ]; then
              echo "  no news.db file — TNT likely uses Postgres. Trying that…"
              # TNT shares the same Postgres as everything else on this box.
              # Find the running postgres container and dump the row.
              PG_CONTAINER=$(docker ps --format '{{.Names}}' | grep -E 'postgres|db' | head -1)
              if [ -z "$PG_CONTAINER" ]; then
                echo "::error::No postgres container found"
                exit 1
              fi
              echo "  postgres container: $PG_CONTAINER"
              # List databases to find TNT's
              echo "  databases:"
              docker exec "$PG_CONTAINER" psql -U postgres -lqt 2>/dev/null | awk -F'|' '{gsub(/^ +| +$/, "", $1); if ($1 != "" && $1 !~ /^(template|postgres)/) print "    "$1}' | head -10
            else
              echo "  found SQLite DB: $DB"
            fi

            # Try TNT databases: tnt, tradingnews, tnt_news, news
            TOC_ACCESS_TOKEN=""
            for dbname in tnt tradingnews tnt_news news pieta_news; do
              v=$(docker exec "$PG_CONTAINER" psql -U postgres -d "$dbname" -tAc \
                "SELECT access_token FROM toconline_tokens LIMIT 1" 2>/dev/null || true)
              if [ -n "$v" ]; then
                echo "  found token in db: $dbname"
                TOC_ACCESS_TOKEN="$v"
                break
              fi
            done

            if [ -z "$TOC_ACCESS_TOKEN" ]; then
              echo "::error::TNT DB has no access_token. TNT side may need to re-auth first."
              exit 1
            fi
            echo "→ Borrowed access_token from TNT (length ${#TOC_ACCESS_TOKEN})"

            docker compose exec -T -e TOC_ACCESS_TOKEN="$TOC_ACCESS_TOKEN" \
              api python scripts/toconline_create_products.py
