name: Create TOConline products

# One-shot: create the 3 pietas.care products in TOConline.
# Idempotent — re-runs are safe (existing item_codes are skipped).

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Run via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.5.182
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -eu
            cd /opt/pieta-care
            git fetch origin main
            git reset --hard origin/main
            docker compose exec -T api python scripts/toconline_create_products.py
