name: Create TOConline products

# One-shot: create the 3 pietas.care products in TOConline.
# Idempotent — re-runs are safe (existing item_codes are skipped).

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Run via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.5.182
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -eu
            cd /opt/pieta-care
            git fetch origin main
            git reset --hard origin/main

            # Read TNT's DATABASE_URL from its .env, then query TOConline tokens.
            TNT_DB_URL=$(grep -E '^DATABASE_URL=' /opt/tnt/.env 2>/dev/null \
              | head -1 | sed -E "s/^DATABASE_URL=//; s/^['\"]//; s/['\"]$//")
            if [ -z "$TNT_DB_URL" ]; then
              echo "::error::No DATABASE_URL in /opt/tnt/.env"
              exit 1
            fi
            echo "→ TNT DB: ${TNT_DB_URL%%@*}@…"  # mask password+host

            # Use the pieta-care api container (has psycopg) to query TNT's DB.
            # The container can reach the Postgres host since they're on the
            # same docker network (or Hetzner network).
            TOC_ACCESS_TOKEN=$(docker compose exec -T -e _TNT_DB="$TNT_DB_URL" api \
              python -c "
            import os, psycopg2
            conn = psycopg2.connect(os.environ['_TNT_DB'])
            cur = conn.cursor()
            cur.execute('SELECT access_token FROM toconline_tokens LIMIT 1')
            row = cur.fetchone()
            print(row[0] if row else '')
            " 2>/dev/null | tr -d '\r\n' || true)

            if [ -z "$TOC_ACCESS_TOKEN" ]; then
              echo "::error::TNT DB has no access_token. TNT side may need to re-auth first."
              exit 1
            fi
            echo "→ Borrowed access_token from TNT (length ${#TOC_ACCESS_TOKEN})"

            docker compose exec -T -e TOC_ACCESS_TOKEN="$TOC_ACCESS_TOKEN" \
              api python scripts/toconline_create_products.py
