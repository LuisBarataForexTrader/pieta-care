name: Create TOConline products

# One-shot: create the 3 pietas.care products in TOConline.
# Idempotent — re-runs are safe (existing item_codes are skipped).

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Run via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.5.182
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -eu
            cd /opt/pieta-care
            git fetch origin main
            git reset --hard origin/main

            # Debug: figure out where TNT lives + what its DB looks like
            echo "→ TNT discovery"
            which sqlite3 || echo "  sqlite3 not installed"
            for p in /opt/tnt/news.db /opt/tnt/backend/news.db /home/luisbarata/tnt/news.db; do
              [ -f "$p" ] && echo "  found DB: $p ($(stat -c '%s bytes' $p))"
            done

            DB=/opt/tnt/news.db
            if [ ! -f "$DB" ]; then
              echo "::error::TNT DB not at $DB. Adjust path."
              exit 1
            fi
            echo "→ Tables in $DB:"
            sqlite3 "$DB" ".tables" 2>&1 | head -3
            echo "→ toconline_tokens schema:"
            sqlite3 "$DB" ".schema toconline_tokens" 2>&1 | head -5
            echo "→ toconline_tokens count:"
            sqlite3 "$DB" "SELECT COUNT(*), id FROM toconline_tokens" 2>&1 | head -3

            TOC_ACCESS_TOKEN=$(sqlite3 "$DB" \
              "SELECT access_token FROM toconline_tokens LIMIT 1" 2>/dev/null || true)

            if [ -z "$TOC_ACCESS_TOKEN" ]; then
              echo "::error::TNT DB has no access_token. TNT side may need to re-auth first."
              exit 1
            fi
            echo "→ Borrowed access_token from TNT (length ${#TOC_ACCESS_TOKEN})"

            docker compose exec -T -e TOC_ACCESS_TOKEN="$TOC_ACCESS_TOKEN" \
              api python scripts/toconline_create_products.py
