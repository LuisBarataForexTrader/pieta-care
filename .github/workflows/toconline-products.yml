name: Create TOConline products

# One-shot: create the 3 pietas.care products in TOConline.
# Idempotent — re-runs are safe (existing item_codes are skipped).

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Run via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.5.182
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -eu
            cd /opt/pieta-care
            git fetch origin main
            git reset --hard origin/main

            # TNT uses authorization_code + refresh_token. Read TNT's
            # current access_token from its SQLite DB and pass it via
            # env to the pieta script.
            TOC_ACCESS_TOKEN=$(sqlite3 /opt/tnt/news.db \
              "SELECT access_token FROM toconline_tokens WHERE id=1" 2>/dev/null || true)

            if [ -z "$TOC_ACCESS_TOKEN" ]; then
              echo "::error::TNT DB has no access_token. TNT side may need to re-auth first."
              exit 1
            fi
            echo "→ Borrowed access_token from TNT (length ${#TOC_ACCESS_TOKEN})"

            docker compose exec -T -e TOC_ACCESS_TOKEN="$TOC_ACCESS_TOKEN" \
              api python scripts/toconline_create_products.py
