name: Resend domain migration

on:
  workflow_dispatch:
    inputs:
      step:
        description: "1=remove old + add new, 2=verify, 3=switch EMAIL_FROM"
        required: true
        default: "1"

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Run via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          STEP: ${{ inputs.step }}
        with:
          host: 178.104.5.182
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: STEP
          script: |
            set -eu
            cd /opt/pieta-care
            apt-get install -y jq >/dev/null 2>&1 || true

            KEY=$(grep '^RESEND_API_KEY=' backend/.env | cut -d= -f2-)
            if [ -z "$KEY" ]; then echo "RESEND_API_KEY missing"; exit 1; fi

            R() { curl -s -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" "$@"; }

            case "$STEP" in
              1)
                echo "Listing current domains:"
                R https://api.resend.com/domains | jq '.data[] | {id,name,status,region}'

                OLD=$(R https://api.resend.com/domains | jq -r '.data[] | select(.name=="pieta.care") | .id')
                if [ -n "$OLD" ]; then
                  echo "Removing pieta.care ($OLD):"
                  R -X DELETE "https://api.resend.com/domains/$OLD" | jq .
                else
                  echo "pieta.care not present, skipping"
                fi

                echo "Adding pietas.care:"
                R -X POST https://api.resend.com/domains -d '{"name":"pietas.care","region":"eu-west-1"}' | jq .

                NEW=$(R https://api.resend.com/domains | jq -r '.data[] | select(.name=="pietas.care") | .id')
                echo "Records for pietas.care ($NEW):"
                R "https://api.resend.com/domains/$NEW" | jq '.records'
                ;;

              2)
                NEW=$(R https://api.resend.com/domains | jq -r '.data[] | select(.name=="pietas.care") | .id')
                echo "Triggering verify on pietas.care ($NEW):"
                R -X POST "https://api.resend.com/domains/$NEW/verify" | jq .
                echo "Status:"
                R "https://api.resend.com/domains/$NEW" | jq '{status, records: [.records[] | {record, name, status}]}'
                ;;

              3)
                echo "Switching EMAIL_FROM to noreply@pietas.care"
                if grep -q '^EMAIL_FROM=' backend/.env; then
                  sed -i 's|^EMAIL_FROM=.*|EMAIL_FROM=noreply@pietas.care|' backend/.env
                else
                  echo 'EMAIL_FROM=noreply@pietas.care' >> backend/.env
                fi
                grep '^EMAIL_FROM=' backend/.env
                docker compose restart api
                echo "Done"
                ;;

              6)
                # One-shot: wipe a single user account by email so it can
                # be re-registered cleanly. Email hard-coded; this branch
                # is meant for ad-hoc cleanup, not regular use.
                EMAIL_TO_WIPE='central7.pt@gmail.com'
                echo "==== Wiping user $EMAIL_TO_WIPE ===="
                docker compose exec -T -e EMAIL_TO_WIPE="$EMAIL_TO_WIPE" -w /app api python -c "
import os
from sqlalchemy import select, delete
from app.core.database import SessionLocal
from app.models.user import User
from app.models.elderly import ElderlyProfile
from app.models.family import FamilyMember
from app.models.medication import Medication, MedicationLog
from app.models.health import VitalSign, WellbeingLog, Incident, DailyNote, ClinicalDiagnosis, Vaccination, CarePlanItem
from app.models.calendar import CalendarEvent, Task
from app.models.chat import ChatMessage, ChatRead
from app.models.document import Document
from app.models.support import SupportThread, SupportMessage

email = os.environ['EMAIL_TO_WIPE']
db = SessionLocal()
try:
    u = db.scalar(select(User).where(User.email == email))
    if not u:
        print(f'No user with email {email}'); raise SystemExit(0)
    print(f'Found user id={u.id} email={u.email} verified={u.is_verified}')
    eids = [e.id for e in db.scalars(select(ElderlyProfile).where(ElderlyProfile.created_by == u.id)).all()]
    print(f'  cascading {len(eids)} elderly profile(s)…')
    if eids:
        med_ids = [m.id for m in db.scalars(select(Medication).where(Medication.elderly_id.in_(eids))).all()]
        if med_ids:
            db.execute(delete(MedicationLog).where(MedicationLog.medication_id.in_(med_ids)))
        db.execute(delete(Medication).where(Medication.elderly_id.in_(eids)))
        for tbl in (VitalSign, WellbeingLog, Incident, DailyNote, ClinicalDiagnosis, Vaccination, CarePlanItem, CalendarEvent, Task, Document, ChatMessage, ChatRead):
            db.execute(delete(tbl).where(tbl.elderly_id.in_(eids)))
        db.execute(delete(FamilyMember).where(FamilyMember.elderly_id.in_(eids)))
        db.execute(delete(ElderlyProfile).where(ElderlyProfile.id.in_(eids)))
    db.execute(delete(FamilyMember).where(FamilyMember.user_id == u.id))
    db.execute(delete(SupportMessage).where(SupportMessage.sender_id == u.id))
    thr_ids = [t.id for t in db.scalars(select(SupportThread).where(SupportThread.user_id == u.id)).all()]
    if thr_ids:
        db.execute(delete(SupportMessage).where(SupportMessage.thread_id.in_(thr_ids)))
    db.execute(delete(SupportThread).where(SupportThread.user_id == u.id))
    db.execute(delete(ChatMessage).where(ChatMessage.sender_id == u.id))
    db.execute(delete(ChatRead).where(ChatRead.user_id == u.id))
    db.delete(u)
    db.commit()
    print(f'✅ wiped user {email} and all related rows')
except Exception as e:
    db.rollback(); print(f'❌ {e}'); raise
finally:
    db.close()
"
                ;;

              5)
                echo "==== Diagnose email setup ===="
                echo "→ backend/.env (email-related):"
                grep -E '^(EMAIL_FROM|RESEND_API_KEY|FRONTEND_URL|BACKEND_PUBLIC_URL|SMTP_)' backend/.env | sed 's/\(RESEND_API_KEY=\).\{12\}.*/\1<redacted>/' || true
                echo
                echo "→ Resend domain status:"
                R https://api.resend.com/domains | jq '.data[] | {name, status, region}'
                echo
                echo "→ Last 5 emails sent in the past 24h (if any):"
                R "https://api.resend.com/emails?limit=5" | jq '.data[] | {to, subject, created_at, last_event}' 2>/dev/null || echo "(API may not expose this)"
                echo
                echo "→ Last 30 lines of API logs that mention 'email' or 'resend':"
                docker compose logs --tail 500 api 2>&1 | grep -iE "email|resend|mail" | tail -30 || echo "(none)"
                ;;

              4)
                echo "→ Current backend/.env (URLs only):"
                grep -E '^(FRONTEND_URL|FRONTEND_URL_VERCEL|BACKEND_PUBLIC_URL|EMAIL_FROM)=' backend/.env || echo "(none of those keys set)"
                echo
                echo "→ Setting FRONTEND_URL=https://pietas.care and BACKEND_PUBLIC_URL=https://api.pietas.care"
                for kv in 'FRONTEND_URL=https://pietas.care' 'BACKEND_PUBLIC_URL=https://api.pietas.care'; do
                  k=$(echo "$kv" | cut -d= -f1)
                  if grep -q "^${k}=" backend/.env; then
                    sed -i "s|^${k}=.*|${kv}|" backend/.env
                  else
                    echo "$kv" >> backend/.env
                  fi
                done
                grep -E '^(FRONTEND_URL|BACKEND_PUBLIC_URL)=' backend/.env
                docker compose restart api
                echo "✅ Restarted"
                ;;

              *)
                echo "Unknown step: $STEP"; exit 1
                ;;
            esac
