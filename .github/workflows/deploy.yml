name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_FAMILIA: ${{ secrets.STRIPE_PRICE_FAMILIA }}
          STRIPE_PRICE_FAMILIA_PLUS: ${{ secrets.STRIPE_PRICE_FAMILIA_PLUS }}
          STRIPE_PRICE_CUIDADOR_PRO: ${{ secrets.STRIPE_PRICE_CUIDADOR_PRO }}
        with:
          host: 178.104.5.182
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: ANTHROPIC_API_KEY,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,STRIPE_PRICE_FAMILIA,STRIPE_PRICE_FAMILIA_PLUS,STRIPE_PRICE_CUIDADOR_PRO
          script: |
            cd /opt/pieta-care
            git pull origin main

            # Sync env vars into backend/.env (idempotent)
            sync_env() {
              local key="$1"; local value="$2"
              [ -z "$value" ] && return
              touch backend/.env
              if grep -q "^${key}=" backend/.env; then
                sed -i "s|^${key}=.*|${key}=${value}|" backend/.env
              else
                echo "${key}=${value}" >> backend/.env
              fi
            }
            sync_env ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
            sync_env STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
            sync_env STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
            sync_env STRIPE_PRICE_FAMILIA "$STRIPE_PRICE_FAMILIA"
            sync_env STRIPE_PRICE_FAMILIA_PLUS "$STRIPE_PRICE_FAMILIA_PLUS"
            sync_env STRIPE_PRICE_CUIDADOR_PRO "$STRIPE_PRICE_CUIDADOR_PRO"

            docker compose build --no-cache api
            docker compose up -d
            docker compose exec -T -e PYTHONPATH=/app -w /app api alembic upgrade head

            # Ensure nginx serves api.pietas.care (idempotent — runs every deploy)
            NGINX_CONF=$(grep -lrE 'server_name[[:space:]]+api\.pieta\.care' /etc/nginx/sites-enabled/ /etc/nginx/sites-available/ 2>/dev/null | head -1)
            if [ -n "$NGINX_CONF" ] && ! grep -q 'api\.pietas\.care' "$NGINX_CONF"; then
              echo "→ Adding api.pietas.care to $NGINX_CONF"
              sed -i 's/\(server_name[[:space:]]\+api\.pieta\.care\)\([[:space:]]*;\)/\1 api.pietas.care\2/' "$NGINX_CONF"
              nginx -t && systemctl reload nginx && echo "✅ nginx reloaded"

              # Wait until DNS resolves api.pietas.care to this host before
              # asking Let's Encrypt — avoids HTTP-01 failures on first run
              for i in 1 2 3 4 5 6; do
                IP=$(getent hosts api.pietas.care | awk '{print $1; exit}')
                if [ "$IP" = "178.104.5.182" ]; then
                  echo "→ DNS OK, expanding certificate"
                  certbot --nginx -d api.pieta.care -d api.pietas.care \
                    --expand --non-interactive --agree-tos -m luisbarata@proton.me \
                    || echo "⚠ certbot failed — re-run after DNS settles"
                  break
                fi
                echo "   DNS not ready yet (attempt $i/6) — sleeping 30s"
                sleep 30
              done
            else
              echo "→ nginx api.pietas.care: already configured or config not found"
            fi

            echo "✅ Deploy concluído $(date)"
