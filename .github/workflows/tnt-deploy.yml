name: Deploy TNT (pull + restart)

# One-shot: pull latest TNT main and restart the service. Use after
# pushing TOConline-related changes to TNT that pieta-care depends on
# (e.g. the OAuth callback proxy).

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull + restart TNT via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.5.182
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -eu

            TNT=/opt/tnt
            if [ ! -f "$TNT/main.py" ]; then
              echo "::error::TNT main.py not at $TNT"
              exit 1
            fi
            echo "→ TNT path: $TNT"

            # /opt/tnt is a file-copy deployment (no .git). Patch the
            # callback handler in place with the pieta proxy block.
            # Idempotent — only patches if the marker isn't already present.
            cat > /tmp/tnt_patch.py <<'PYEOF'
            import re, sys

            path = "/opt/tnt/main.py"
            with open(path) as f:
                src = f.read()

            if "[TOCONLINE] proxying to pieta" in src:
                print("  = proxy block already present, skipping")
                sys.exit(0)

            INJECT = (
                '    state_param = request.query_params.get("state", "")\n'
                '    if state_param.startswith("pieta-"):\n'
                '        from urllib.parse import urlencode as _urlenc\n'
                '        target = f"https://api.pietas.care/api/v1/toconline/callback?{_urlenc(dict(request.query_params))}"\n'
                '        print(f"[TOCONLINE] proxying to pieta: state={state_param[:20]}...")\n'
                '        return RedirectResponse(target, status_code=302)\n\n'
            )

            pattern = re.compile(
                r'(@app\.get\("/toconline/callback"\)\s*\nasync def toconline_callback\([^)]*\):\s*\n\s*"""[^"]+"""\n)',
                re.MULTILINE,
            )
            new_src, n = pattern.subn(lambda m: m.group(1) + INJECT, src, count=1)
            if n == 0:
                print("::error::callback regex did not match — TNT main.py shape changed", file=sys.stderr)
                sys.exit(1)
            with open(path, "w") as f:
                f.write(new_src)
            print(f"  patched {path}")
            PYEOF
            # Strip leading indentation that YAML preserved (12 spaces per line).
            sed -i 's/^            //' /tmp/tnt_patch.py
            python3 /tmp/tnt_patch.py
            rm -f /tmp/tnt_patch.py

            # TNT runs from a Procfile (uvicorn). Discover how it's
            # supervised — systemd / supervisor / docker — and restart.
            if systemctl list-units --type=service --no-legend 2>/dev/null | grep -qE '^tnt|tradingnews'; then
              SVC=$(systemctl list-units --type=service --no-legend | grep -E '^tnt|tradingnews' | awk '{print $1}' | head -1)
              echo "→ Restarting systemd service: $SVC"
              systemctl restart "$SVC"
              systemctl status "$SVC" --no-pager | head -3
            elif command -v supervisorctl >/dev/null 2>&1 && supervisorctl status 2>/dev/null | grep -qE '^tnt'; then
              SVC=$(supervisorctl status | grep -E '^tnt' | awk '{print $1}' | head -1)
              echo "→ Restarting supervisor program: $SVC"
              supervisorctl restart "$SVC"
            elif docker ps --format '{{.Names}}' | grep -qE 'tnt|tradingnews'; then
              CN=$(docker ps --format '{{.Names}}' | grep -E 'tnt|tradingnews' | head -1)
              echo "→ Restarting docker container: $CN"
              docker restart "$CN"
            else
              echo "::warning::No tnt service/container found. Manual restart needed."
              echo "→ Discovery dump:"
              echo "  systemctl: $(systemctl list-units --type=service --no-legend 2>/dev/null | head -10)"
              echo "  docker:    $(docker ps --format '{{.Names}}' 2>/dev/null | head -10)"
            fi
