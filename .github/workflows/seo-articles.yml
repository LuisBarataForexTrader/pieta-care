name: SEO Article Generator

on:
  schedule:
    # 07:00 Portugal (UTC+1 winter / UTC+2 summer) → run at 06:00 UTC daily
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Generate a specific slug (leave empty for auto-pick)'
        required: false
      count:
        description: 'Number of articles to generate (default: 2)'
        required: false
        default: '2'
      dry_run:
        description: 'Dry run (no API calls, no files written)'
        type: boolean
        required: false
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we can commit and push
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/seo_agent/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/seo_agent/requirements.txt

      - name: Generate articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            ARGS="$ARGS --slug ${{ github.event.inputs.slug }}"
          fi
          if [ -n "${{ github.event.inputs.count }}" ]; then
            ARGS="$ARGS --count ${{ github.event.inputs.count }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/seo_agent/generate.py $ARGS

      - name: Commit and push new articles
        run: |
          git config user.name  "pietas-seo-bot"
          git config user.email "bot@pietas.care"

          # Only stage new/modified markdown files in content/guias/
          git add frontend/content/guias/

          if git diff --cached --quiet; then
            echo "No new articles generated — nothing to commit."
            exit 0
          fi

          COUNT=$(git diff --cached --name-only | wc -l | tr -d ' ')
          git commit -m "feat(seo): add $COUNT SEO article(s) [skip ci]

          Generated by seo-articles workflow on $(date -u '+%Y-%m-%d')."

          git push origin main
