name: Stripe branding setup

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Run branding script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.5.182
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -eu
            cd /opt/pieta-care
            git fetch origin main
            git reset --hard origin/main

            # The container already has STRIPE_SECRET_KEY in its env
            # from backend/.env (synced by the deploy workflow).
            docker compose exec -T api python scripts/stripe_branding_setup.py
