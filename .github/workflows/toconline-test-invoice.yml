name: Test TOConline invoice

# Smoke test: issue a real test fatura through the pieta-care
# integration. Real FT — counts against the TOConline series.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.5.182
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -eu
            cd /opt/pieta-care
            git fetch origin main
            git reset --hard origin/main
            docker compose exec -T api python scripts/toconline_test_invoice.py
