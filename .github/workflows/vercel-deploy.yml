name: Deploy frontend to Vercel

on:
  push:
    branches: [main]
    # Only run when files that affect the frontend bundle change.
    # Backend-only commits skip the Vercel rebuild.
    paths:
      - 'frontend/**'
      - '.github/workflows/vercel-deploy.yml'
  workflow_dispatch:

# Cancel any in-flight Vercel deploy when a newer commit lands; only the
# latest commit's deploy should reach production.
concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN:    ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID:   team_h1XwA4YXlMw5gk6IBC01y76w
      VERCEL_PROJECT_ID: prj_017h19TtpuPOaR3skgyfckY4zwgA
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
