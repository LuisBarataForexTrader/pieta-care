name: Sync TOConline credentials from TNT

# One-shot: copy TOCONLINE_CLIENT_ID / CLIENT_SECRET / SERIES_ID etc.
# from the TNT container (which already has them) into pieta-care's
# backend/.env, on the same Hetzner box. Avoids round-tripping the
# values through GitHub secrets — they never leave the server.

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.5.182
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script_stop: true
          script: |
            set -u
            cd /opt/pieta-care

            # Find any .env file on the box that has a populated
            # TOCONLINE_CLIENT_ID. TNT runs as a Procfile/systemd service
            # (no docker-compose), so its env lives in a plain .env file.
            SRC=""
            for path in $(find /opt /home -maxdepth 4 -name '.env' -type f 2>/dev/null); do
              [ "$path" = "/opt/pieta-care/backend/.env" ] && continue
              if grep -qE '^TOCONLINE_CLIENT_ID=.+' "$path"; then
                SRC="$path"
                break
              fi
            done
            if [ -z "$SRC" ]; then
              echo "::error::No .env file on this box has a populated TOCONLINE_CLIENT_ID"
              exit 1
            fi
            echo "→ Source .env: $SRC"

            touch backend/.env

            sync_one() {
              local key="$1"; local val="$2"
              [ -z "$val" ] && return 0
              # Atomic replace: strip old line, append new, swap file.
              grep -v "^${key}=" backend/.env > backend/.env.tmp || true
              echo "${key}=${val}" >> backend/.env.tmp
              mv backend/.env.tmp backend/.env
              echo "  ✓ $key"
            }

            extract() {
              # extract VALUE from KEY=VALUE in $SRC (handles surrounding quotes)
              local key="$1"
              grep -E "^${key}=" "$SRC" 2>/dev/null | head -1 | sed -E "s/^${key}=//; s/^['\"]//; s/['\"]$//"
            }

            sync_one TOCONLINE_CLIENT_ID     "$(extract TOCONLINE_CLIENT_ID)"
            sync_one TOCONLINE_CLIENT_SECRET "$(extract TOCONLINE_CLIENT_SECRET)"
            # Series ID + exemption code may live in TNT's main.py as
            # constants instead of env. Default to TNT's hard-coded values.
            S="$(extract TOCONLINE_SERIES_ID)"
            sync_one TOCONLINE_SERIES_ID "${S:-8670652}"
            E="$(extract TOCONLINE_EXEMPTION_NON_EU)"
            sync_one TOCONLINE_EXEMPTION_NON_EU "${E:-28}"

            docker compose restart api
            echo "✅ pieta-care api restarted with TOConline env"
