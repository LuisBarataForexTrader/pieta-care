name: Sync TOConline credentials from TNT

# One-shot: copy TOCONLINE_CLIENT_ID / CLIENT_SECRET / SERIES_ID etc.
# from the TNT container (which already has them) into pieta-care's
# backend/.env, on the same Hetzner box. Avoids round-tripping the
# values through GitHub secrets — they never leave the server.

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.5.182
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            cd /opt/pieta-care

            # 1) Find a container that has a NON-EMPTY TOCONLINE_CLIENT_ID
            # (excludes pieta-care itself, which defines the var as "" by default).
            CONTAINER=""
            for name in $(docker ps --format '{{.Names}}'); do
              [ "$name" = "pieta-care-api-1" ] && continue
              v=$(docker exec "$name" printenv TOCONLINE_CLIENT_ID 2>/dev/null || true)
              if [ -n "$v" ]; then
                CONTAINER="$name"
                break
              fi
            done
            if [ -z "$CONTAINER" ]; then
              echo "::error::No running container has a populated TOCONLINE_CLIENT_ID"
              exit 1
            fi
            echo "→ Source container: $CONTAINER"

            touch backend/.env

            sync_one() {
              local key="$1"; local val="$2"
              [ -z "$val" ] && return
              # Atomic replace: strip old line, append new, swap file.
              grep -v "^${key}=" backend/.env > backend/.env.tmp || true
              echo "${key}=${val}" >> backend/.env.tmp
              mv backend/.env.tmp backend/.env
              echo "  ✓ $key"
            }

            for key in TOCONLINE_CLIENT_ID TOCONLINE_CLIENT_SECRET; do
              v=$(docker exec "$CONTAINER" printenv "$key" 2>/dev/null || true)
              sync_one "$key" "$v"
            done

            # SERIES_ID + EXEMPTION_NON_EU may not exist in TNT's env if they're
            # hard-coded constants. Use the defaults from TNT main.py.
            S=$(docker exec "$CONTAINER" printenv TOCONLINE_SERIES_ID 2>/dev/null || true)
            sync_one TOCONLINE_SERIES_ID "${S:-8670652}"
            E=$(docker exec "$CONTAINER" printenv TOCONLINE_EXEMPTION_NON_EU 2>/dev/null || true)
            sync_one TOCONLINE_EXEMPTION_NON_EU "${E:-28}"

            docker compose restart api
            echo "✅ pieta-care api restarted with TOConline env"
