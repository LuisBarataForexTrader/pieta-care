name: Sync TOConline credentials from TNT

# One-shot: copy TOCONLINE_CLIENT_ID / CLIENT_SECRET / SERIES_ID etc.
# from the TNT container (which already has them) into pieta-care's
# backend/.env, on the same Hetzner box. Avoids round-tripping the
# values through GitHub secrets — they never leave the server.

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.5.182
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -u
            cd /opt/pieta-care

            # Find any file on the box that has a populated
            # TOCONLINE_CLIENT_ID. Could be a .env file, systemd
            # service file, or a docker container's env list.
            echo "→ Searching .env-like files…"
            SRC=$(grep -lrIE '^TOCONLINE_CLIENT_ID=.+' \
              /opt /home /etc/systemd /etc/environment /root \
              2>/dev/null \
              | grep -v '^/opt/pieta-care/backend/\.env$' \
              | head -1 || true)

            if [ -z "$SRC" ]; then
              echo "→ Searching running containers…"
              for name in $(docker ps --format '{{.Names}}' 2>/dev/null); do
                [ "$name" = "pieta-care-api-1" ] && continue
                v=$(docker exec "$name" printenv TOCONLINE_CLIENT_ID 2>/dev/null || true)
                if [ -n "$v" ]; then
                  echo "→ Found in container: $name"
                  SRC="docker:$name"
                  break
                fi
              done
            fi

            if [ -z "$SRC" ]; then
              echo "::error::No file or container on this box has a populated TOCONLINE_CLIENT_ID"
              echo "::error::Searched: /opt /home /etc/systemd /etc/environment /root + all docker containers"
              echo "::error::TNT must have its TOConline env stored elsewhere — please tell me where."
              exit 1
            fi
            echo "→ Source: $SRC"

            touch backend/.env

            sync_one() {
              local key="$1"; local val="$2"
              [ -z "$val" ] && return 0
              # Atomic replace: strip old line, append new, swap file.
              grep -v "^${key}=" backend/.env > backend/.env.tmp || true
              echo "${key}=${val}" >> backend/.env.tmp
              mv backend/.env.tmp backend/.env
              echo "  ✓ $key"
            }

            extract() {
              # extract VALUE from KEY=VALUE in $SRC. Handles two source types:
              # - file path → grep + sed
              # - "docker:<name>" → printenv inside the container
              local key="$1"
              if [ "${SRC#docker:}" != "$SRC" ]; then
                docker exec "${SRC#docker:}" printenv "$key" 2>/dev/null || true
              else
                grep -E "^${key}=" "$SRC" 2>/dev/null | head -1 | sed -E "s/^${key}=//; s/^['\"]//; s/['\"]$//"
              fi
            }

            CID="$(extract TOCONLINE_CLIENT_ID)"
            CSEC="$(extract TOCONLINE_CLIENT_SECRET)"
            echo "  CLIENT_ID length: ${#CID}"
            echo "  CLIENT_SECRET length: ${#CSEC}"
            sync_one TOCONLINE_CLIENT_ID "$CID"
            sync_one TOCONLINE_CLIENT_SECRET "$CSEC"
            # Series ID + exemption code may live in TNT's main.py as
            # constants instead of env. Default to TNT's hard-coded values.
            S="$(extract TOCONLINE_SERIES_ID)"
            sync_one TOCONLINE_SERIES_ID "${S:-8670652}"
            E="$(extract TOCONLINE_EXEMPTION_NON_EU)"
            sync_one TOCONLINE_EXEMPTION_NON_EU "${E:-28}"

            docker compose restart api
            echo "✅ pieta-care api restarted with TOConline env"
