name: Hard restart TNT

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: SIGTERM all TNT processes + verify respawn
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.5.182
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -u

            echo "→ TNT processes BEFORE:"
            ps -ef | grep -E '/opt/tnt|main:app' | grep -v grep || echo "  (none)"
            echo ""

            echo "→ Sending SIGTERM to ALL uvicorn processes binding port 8000 (TNT's port):"
            # Match: any uvicorn for main:app (TNT). Both /opt/tnt/venv and
            # the system /usr/local/bin uvicorn need to be killed — they
            # all bind port 8000 and only one wins.
            PIDS=$(ps -ef | grep -E 'uvicorn main:app|/opt/tnt/' | grep -v grep | awk '{print $2}')
            for p in $PIDS; do
              echo "  killing $p"
              kill -TERM "$p" 2>/dev/null || true
            done

            sleep 3

            # Force-kill any stragglers
            for p in $PIDS; do
              if kill -0 "$p" 2>/dev/null; then
                echo "  KILL -9 $p (didn't exit on TERM)"
                kill -KILL "$p" 2>/dev/null || true
              fi
            done

            sleep 2

            echo ""
            echo "→ TNT processes AFTER:"
            ps -ef | grep -E '/opt/tnt|main:app' | grep -v grep || echo "  (none)"
            echo ""

            # Kill any stragglers from manual previous attempts
            for p in $(ps -ef | grep -E '/opt/tnt/venv/bin/uvicorn' | grep -v grep | awk '{print $2}'); do
              echo "  cleanup straggler $p"
              kill -KILL "$p" 2>/dev/null || true
            done
            sleep 2

            echo ""
            echo "→ Wait 10s for supervisor to respawn + TNT to import (1.8MB main.py is slow)…"
            sleep 10

            echo ""
            echo "→ TNT processes FINAL:"
            ps -ef | grep -E 'uvicorn main:app' | grep -v grep
            echo ""
            echo "→ Parent of TNT process (the supervisor):"
            for p in $(ps -ef | grep -E 'uvicorn main:app --host 0\.0\.0\.0' | grep -v grep | awk '{print $2}'); do
              ppid=$(ps -p "$p" -o ppid= | tr -d ' ')
              ps -p "$ppid" -o pid,ppid,cmd | tail -1
            done

            echo ""
            echo "→ Smoke test (state=pieta-X should redirect 302):"
            for try in 1 2 3 4 5; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                "https://api.tradingnewsterminal.com/toconline/callback?state=pieta-test123&code=fake")
              if [ "$CODE" = "302" ]; then
                LOC=$(curl -s -o /dev/null -w "%{redirect_url}" \
                  "https://api.tradingnewsterminal.com/toconline/callback?state=pieta-test123&code=fake")
                echo "  HTTP 302 ✓ Location: $LOC"
                exit 0
              fi
              echo "  attempt $try: HTTP $CODE (waiting 5s…)"
              sleep 5
            done
            echo "::error::TNT still not returning 302 after retries"
            exit 1
